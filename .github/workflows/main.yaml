
name: Playwright Docker Tests

on:
  push:
    branches:
      - playwright-docker-github-actions
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aqa-playwright-firefox .

      - name: Run Playwright tests in Docker
        env:
          TEST_ENV: qauto
          BASE_URL: ${{ secrets.BASE_URL }}
          HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
          HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}
        run: |
          docker run --rm \
            -e TEST_ENV \
            -e BASE_URL \
            -e HTTP_USERNAME \
            -e HTTP_PASSWORD \
            aqa-playwright-firefox \
            npx playwright test \
              --project=firefox \
              --workers=2 \
              --retries=0 \
              --forbid-only \
              --grep-invert "REG-03"
